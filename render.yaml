services:
  - type: web
    name: bookly-support-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Set this in the Render dashboard. It never lives in git.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      # Voice out. Leave the key unset and the browser speaks instead — the
      # deploy still works, it just loses the vendor voice.
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: TTS_PROVIDER
        value: elevenlabs
      - key: ELEVENLABS_VOICE_ID
        value: cgSgspJ2msm6clMCkdW9
      - key: ELEVENLABS_MODEL
        value: eleven_flash_v2_5
